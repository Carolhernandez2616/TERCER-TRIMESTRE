<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAZONAMIENTO CUANTITATIVO 1</title>
    <meta name="description" content="Herramienta educativa para clasificar numeros en conjuntos (naturales ,enteros, racionales) y resolver operacionnes aritmeticas  ">
    <link rel="stylesheet" href="css/styles.css" >
</head>
<body>
  <div class="principal">
    <nav class="opciones-nav" role="tablist">
        <button class="tab-btn" role="tab">
            <span class="nav-tab-text">CONJUNTOS DE NUMEROS</span> 
        </button>

        <button class="tab-btn" role="tab">
            <span class="nav-tab-text">OPERACIONES ARITMETICAS</span>

        </button>
            
        <button class="tab-btn" role="tab">
            <span class="nav-tab-text">:D</span>
        </button>
            
    </nav>
    <section id="panel-clasificar" class="tab-panel active">


        <div class="card">
            <div class="card-header">
                <h2>CLASIFICADOR DE CONJUNTO DE NÚMEROS</h2>
                <p>Ingresa un número y selecciona un conjunto para verificar si pertenece a el:</p>
            </div>
    

            <div class="card-body">
            <div class="card-object">
                <label>Inserte el Número: </label>
               <input type="text" id="numero-input" placeholder="Ej: 1, -8, 3/4, 7.6">
            </div>

            <div class="card-object">
              <select id="select-conjuntos">
                    <option value="Selecciona un conjunto">Selecciona un conjunto</option>
                    <option value="naturales">Naturales (N)</option>
                    <option value="enteros">Enteros (Z)</option>
                    <option value="racionales">Racionales (Q)</option>
             </select>

            </div>
            <button class="tab-btn" id="btn-clasificador" type="button">Evaluar</button>
          </div>
        </div>

   
</body> 
</html>
